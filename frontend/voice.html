<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de Voz</title>
</head>
<body>
    <h1>Prueba de Reconocimiento de Voz</h1>
    
    <!-- Campo de texto donde se insertará el resultado -->
    <textarea id="textField" rows="5" cols="50" placeholder="Habla y el texto aparecerá aquí..."></textarea>
    <br><br>
    
    <!-- Botones para controlar el reconocimiento -->
    <button id="startBtn">Comenzar a hablar</button>
    <button id="stopBtn">Detener</button>
    
    <!-- Script con el código de reconocimiento -->
    <script>
        document.getElementById('startBtn').addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'es-ES';
            recognition.continuous = true;
            recognition.interimResults = true; // Muestra resultados provisionales

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                        document.getElementById('textField').value += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error('Error:', event.error);
                alert('Error: ' + event.error);
            };

            recognition.start();
            alert("Reconocimiento de voz activado. ¡Habla ahora!");
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            // Necesitas guardar la instancia de 'recognition' para poder detenerla.
            // En este ejemplo simple, recargamos la página para detenerlo.
            location.reload();
        });
    </script>
</body>
</html>
